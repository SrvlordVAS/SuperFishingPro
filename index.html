<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Fishing Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(#87CEEB, #1E90FF);
      text-align: center;
      color: white;
    }

    #game {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    #water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(#1E90FF, #00008B);
    }

    #hook {
      position: absolute;
      top: 40%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      display: none;
    }

    #fish {
      position: absolute;
      top: 50%;
      left: 60%;
      width: 40px;
      height: 20px;
      background: yellow;
      border-radius: 10px;
      display: none;
    }

    #hpBar {
      width: 200px;
      height: 20px;
      background: gray;
      margin: 10px auto;
      display: none;
    }

    #hp {
      height: 100%;
      width: 100%;
      background: lime;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #lancar {
      background: red;
      color: white;
    }

    #puxar {
      background: orange;
      color: white;
      display: none;
    }
  </style>
</head>
<body>

<div id="game">
  <h1>🎣 Fishing Game</h1>

  <div id="hpBar"><div id="hp"></div></div>

  <button id="lancar">LANÇAR</button>
  <button id="puxar">PUXAR</button>

  <div id="water"></div>
  <div id="hook"></div>
  <div id="fish"></div>
</div>

<script>
let estado = "esperando";
let hp = 100;

const hook = document.getElementById("hook");
const fish = document.getElementById("fish");
const puxarBtn = document.getElementById("puxar");
const hpBar = document.getElementById("hpBar");
const hpFill = document.getElementById("hp");

document.getElementById("lancar").onclick = () => {
  if (estado !== "esperando") return;

  estado = "lancando";
  hook.style.display = "block";
  hook.style.top = "20%";

  // animação simples descendo
  let pos = 20;
  let interval = setInterval(() => {
    pos += 1;
    hook.style.top = pos + "%";

    if (pos >= 60) {
      clearInterval(interval);
      esperarPeixe();
    }
  }, 20);
};

function esperarPeixe() {
  estado = "esperandoPeixe";
  console.log("Esperando peixe...");

  setTimeout(() => {
    estado = "peixe";
    fish.style.display = "block";
    puxarBtn.style.display = "inline-block";
    hpBar.style.display = "block";
    hp = 100;
    atualizarHP();
    console.log("Peixe mordeu! 🐟");
  }, 2000 + Math.random() * 3000);
}

puxarBtn.onclick = () => {
  if (estado !== "peixe") return;

  hp -= Math.random() * 15;

  atualizarHP();

  if (hp <= 0) {
    alert("Você pegou o peixe! 🎉");
    resetar();
  }
};

function atualizarHP() {
  hpFill.style.width = hp + "%";
}

function resetar() {
  estado = "esperando";
  hook.style.display = "none";
  fish.style.display = "none";
  puxarBtn.style.display = "none";
  hpBar.style.display = "none";
}
</script>

</body>
</html>
